name: Backend dependencies
description: >-
  Python 3.12, the Poetry that wrote poetry.lock and the backend's virtualenv (.venv), restored from a cache keyed by
  what decides them; installed only when the cache missed. 24.10.2026 the contract check fell on a network outage
  installing numpy — every run installed everything anew (DEV-216, DEV-219).
runs:
  using: composite
  steps:
    - name: Set up Python 3.12
      id: python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Read the Poetry version that wrote poetry.lock
      id: poetry
      shell: bash
      run: |
        version=$(sed -n '1s/.*Poetry \([0-9][0-9.]*\).*/\1/p' poetry.lock)
        if [ -z "$version" ]; then
          echo "::error::poetry.lock does not name the Poetry that wrote it (first line)."
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        # The virtualenv lives in the project, so it is cached whole — and every later step of the job finds it.
        echo "POETRY_VIRTUALENVS_IN_PROJECT=true" >> "$GITHUB_ENV"

    - name: Restore backend dependencies
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.poetry
          .venv
        key: backend-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-poetry${{ steps.poetry.outputs.version }}-${{ hashFiles('poetry.lock') }}

    - name: Install backend dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        python -m venv ~/.poetry
        ~/.poetry/bin/pip install "poetry==${{ steps.poetry.outputs.version }}"
        ~/.poetry/bin/poetry install --no-interaction

    - name: Put Poetry on the path
      shell: bash
      run: echo "$HOME/.poetry/bin" >> "$GITHUB_PATH"
