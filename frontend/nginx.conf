# Map ``Upgrade`` request header → value for ``Connection`` toward backend.
# Required so nginx forwards WebSocket upgrades (used by the embedded
# agent terminal at /api/v1/agent-terminal/ws/*) while still closing the
# connection for regular HTTP traffic.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 9177;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The largest request the backend accepts — a file attached for the agent (settings.private_file_max_bytes)
    # and the screenshots of one question for Poradca, base64 (settings.poradca_attachments_max_total_bytes × 4/3).
    # Without it nginx's own 1 MB refused both with 413 before the backend saw them (measured 10.10.2026, DEV-52).
    # tests/test_poradca_sees_pasted_screenshots.py keeps this above every limit in settings.
    client_max_body_size 32m;

    # Gzip compression for text assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Basic security headers (HSTS is intentionally omitted — TLS is terminated upstream).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy API requests to the FastAPI backend service (docker-compose network).
    location /api/ {
        proxy_pass http://backend:9176;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE + WebSocket support. ``$connection_upgrade`` is "upgrade"
        # when the client sent ``Upgrade: websocket`` (agent terminal WS),
        # otherwise "close" — matching the previous ``Connection: ""``
        # behaviour for SSE / long-lived HTTP streams.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Liveness probe for the frontend container.
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"frontend"}';
    }

    # Long-cache immutable static assets produced by Vite (hashed filenames).
    # DEV-21: the installable-app files. The source of truth about the version must never be cached — a cached
    # answer would blind the "is there a newer version?" check. Neither may the service worker: a cached one can
    # keep serving an old cockpit for days. Exact matches ignore the query, so /sw.js?v=<fingerprint> is covered.
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }
    # nginx does not know the .webmanifest extension and would serve application/octet-stream — refused.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }
    location = /offline.html {
        add_header Cache-Control "no-cache" always;
    }
    # The icons sit in the root WITHOUT a content hash in their names. This rule MUST come before the yearly
    # rule below: regex locations are matched in order, and the yearly one would keep a changed icon for a year.
    location ~* ^/(icon[^/]*\.(svg|png)|favicon\.ico)$ {
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — all unknown routes resolve to index.html so React Router can handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML shell so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }
}
