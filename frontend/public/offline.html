<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEX Studio Visual — nie ste pripojení</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="theme-color" content="#0e1116" />
    <!-- Standalone page: contains not a single piece of the app bundle. That is why it is
         the one safe exception to the "cache nothing" rule - it has no way to serve an old
         version.

         FONT: deliberately does NOT request Inter. The page links no stylesheet from the
         bundle, so the font shipped by the library has no way to reach it - requesting it
         would promise something that never arrives. It renders in the system font, just
         like the fallback page embedded in sw.js. Pulling Inter in would require inserting
         its fingerprinted name into the cached list on every build - too much machinery
         for a page a person sees once a year, and a new way to silently desynchronise two
         records.

         COLOURS must equal the values from nex-shared (html.dark). -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center; padding: 24px;
        background: #0e1116; color: #e6e9ee;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card { max-width: 26rem; text-align: center; }
      .brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 28px; }
      .brand img { width: 44px; height: 44px; border-radius: 12px; }
      .brand span { font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.01em; }
      h1 { margin: 0 0 12px; font-size: 1.375rem; font-weight: 600; letter-spacing: -0.02em; }
      p { margin: 0 0 28px; font-size: 0.9375rem; line-height: 1.6; color: #8b95a3; }
      button {
        font: inherit; font-weight: 500; color: #fff; cursor: pointer;
        background: #6d5efc; border: 0; border-radius: 8px; padding: 10px 22px;
        transition: background 120ms ease;
      }
      button:hover { background: #8b7ffd; }
      button:focus-visible { outline: 2px solid #8b7ffd; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <img src="/icon.svg" alt="" />
        <span>NEX Studio Visual</span>
      </div>
      <h1>Nie ste pripojení</h1>
      <p>NEX Studio Visual potrebuje pripojenie k serveru. Skontrolujte pripojenie a skúste to znova.</p>
      <button type="button" onclick="location.reload()">Skúsiť znova</button>
    </main>
  </body>
</html>
