# Explicit project name — survives symlinks and cwd-based derivation.
# Was implicit `nex-studio-src` (from old /opt/nex-studio-src dir).
# Migrated 2026-05-03 per STRUCTURE.md to /opt/projects/nex-studio.
name: nex-studio-visual

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexstudiovisual
      POSTGRES_PASSWORD: nexstudiovisual
      POSTGRES_DB: nexstudiovisual
    ports:
      - "9215:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexstudiovisual -d nexstudiovisual"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      # The ROOT Dockerfile is the only backend recipe — the same one CI builds
      # (`docker build … .`) and the one every deployed image comes from. This
      # used to point at a second `backend/Dockerfile`, so dev and production
      # were built from different files and fixes made in one never reached the
      # other; that file is gone.
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9213:9176"
    volumes:
      - /home/andros/.claude:/home/andros/.claude
      # rw — the backend writes per-project KB documents through KnowledgeBaseWriter
      # (backend/api/dependencies.get_knowledge_base_writer), used by the project routes.
      # It was justified here by the "live documents" generators (STATUS.md / HISTORY.md /
      # ARCHITECT.md), which had no production caller and have since been deleted; the mount
      # stays writable for the writer that IS live, not for the ones that were not.
      - /home/icc/knowledge:/home/icc/knowledge:rw
      # rw — backend bootstraps new projects into /opt/projects/<slug>/
      # via subprocess invocation of icc-claude-template/init.sh on
      # POST /api/v1/projects. Required write access for mkdir + git init
      # + template file copy. Per icc/STRUCTURE.md.
      - /opt/projects:/opt/projects:rw
      # rw — backend manages credentials files (CRUD) here. Per
      # CLAUDE.md §13 + 2026-05-04 design: credentials live OUTSIDE
      # /home/icc/knowledge/ so no RAG indexer / kb_sync can pick them
      # up. ri-gated REST API at /api/v1/credentials is the only way in.
      - /opt/data/nex-studio-visual/credentials:/opt/data/nex-studio-visual/credentials:rw
      - uploads:/app/uploads
      # rw — durable PTY output logs per agent terminal session + the per-turn
      # agent crash diagnostics. Survives BE container restart so the visual
      # scrollback is preserved + ``claude --resume <uuid>`` can continue AI
      # memory. Director directive 2026-05-19. Retention: 30 days, rotation
      # at 100 MB/file (in-place truncate of older half).
      # The target MUST equal backend.constants.paths.TERMINAL_LOG_DIR — a
      # mount at any other path leaves the volume empty while the writes go to
      # the container's writable layer and die on recreate. Pinned by
      # tests/test_durable_log_volume.py.
      - terminal_logs:/var/lib/nex-studio-visual/terminal-logs
      # ro — Docker socket bind mount so AG agents inside the BE
      # container can drive the host Docker daemon (testcontainers
      # integration tests per L-012, Stalwart Mail server for IMAP
      # tests, etc). Director directive 2026-05-19 voľba A.
      # SECURITY: socket access = effective root on host. Acceptable
      # for ICC internal dev (single trusted Director); never enable
      # if NEX Studio is exposed to untrusted users. See backend/
      # Dockerfile comment on the matching docker group (GID 110).
      - /var/run/docker.sock:/var/run/docker.sock
      # rw — backend orchestrates UAT deploys cez Implementer agents.
      # Required pre cross-project `docker compose build/up` v UAT
      # compose files (per CR-NS-002 Director directive 2026-06-01).
      # SECURITY: same as /var/run/docker.sock — effective root on host.
      # Acceptable for ICC internal dev (single trusted Director).
      - /opt/uat:/opt/uat:rw
      # ro — shared ICC infra. Agent Telegram-notify bot token lives at
      # /opt/infra/telegram/icc-agents.env (CR-NS-011). Read-only; the secret
      # file is owned by andros (uid 1000 = container user) so notify can read it.
      - /opt/infra:/opt/infra:ro
    environment:
      DATABASE_URL: "postgresql+pg8000://nexstudiovisual:nexstudiovisual@db:5432/nexstudiovisual"
      TEST_DATABASE_URL: "postgresql+pg8000://nexstudiovisual:nexstudiovisual@db:5432/nexstudiovisual_test"
      SECRET_KEY: "change-me-in-production"
      BACKEND_PORT: "9176"
      FRONTEND_PORT: "9177"
      VITE_API_BASE_URL: "http://localhost:9213"
      CLAUDE_CONFIG_DIR: "/home/andros/.claude"
      CLAUDE_CLI_PATH: "claude"
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN}"
      # Pin claude CLI to the version baked into the Docker image
      # (RUN npm install -g @anthropic-ai/claude-code). The container
      # runs as non-root andros (uid 1000) so the in-process auto-update
      # path (``npm i -g``) cannot write to /usr/local — it fails noisily
      # on every spawn. Disabling the updater silences both "Auto-update
      # failed" and the follow-up "Native installation exists but
      # ~/.local/bin is not in your PATH" warning that derives from the
      # updater scanning the mounted ~/.claude state for installed
      # binaries on the host. Updates happen at Docker image rebuild.
      DISABLE_AUTOUPDATER: "1"
      # GitHub PAT used by create_github_repo to provision the project
      # repository under rauschiccsk on POST /api/v1/projects.
      # Scope required: admin:org (create repo under an organisation)
      # + repo (manage repo metadata). Set in /opt/projects/nex-studio-visual/.env.
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      # gh CLI authentication — used by Implementer (AgentTerminal subprocess)
      # for `gh run watch`, `gh api`, etc. per charter §15.3 CI monitor.
      # Same PAT as GITHUB_TOKEN typically; gh CLI prefers GH_TOKEN env name.
      # Per CR-NS-002 Director directive 2026-06-01.
      GH_TOKEN: "${GH_TOKEN:-}"
      # Dedo's machine identity (ICCINT-14, charter §4.5). What goes in is the SHA-256 DIGEST of Dedo's
      # token, NOT the token: this container also runs the AI Agent with a root shell, so anything the
      # container holds the agent can read — and the agent is the party the boundary binds. The digest
      # verifies Dedo and cannot be replayed by whoever reads it. Passthrough only; the value lives in
      # /opt/projects/nex-studio-visual/.env, never in this file and never in the image. Unset = Dedo's
      # door (/api/v1/dedo/*) stays closed (503), which is the correct default.
      #
      # THIS FILE IS THE DEV/REPO STACK. The PROD instance (v4, ports 9216/9217) is started from
      # /opt/customers/dev/nex-studio-visual/docker-compose.yml, which is hand-maintained and does NOT
      # inherit anything from here — adding the line there is a separate, deliberate step (see .env.example).
      DEDO_API_TOKEN_SHA256: "${DEDO_API_TOKEN_SHA256:-}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9176/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # nex-shared is PUBLIC → the SPA builds IN-CONTAINER (multi-stage Dockerfile).
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL-}"
        VITE_APP_VERSION: "${VITE_APP_VERSION:-0.0.0-dev}"
    restart: unless-stopped
    ports:
      - "9214:9177"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9177/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  uploads:
  terminal_logs:
